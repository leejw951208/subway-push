<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지하철 푸시</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: Pretendard, -apple-system, system-ui, sans-serif;
    background: #E9EEF6;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 50% 35% at 20% 20%, #DBEAFE 0%, transparent 60%),
      radial-gradient(ellipse 45% 30% at 80% 85%, #E0E7FF 0%, transparent 60%),
      #EEF2F8;
  }
  input { font-family: Pretendard, system-ui; }
  button:active { transform: scale(0.97); }
  ::-webkit-scrollbar { display: none; }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.35; }
    50% { transform: scale(1.6); opacity: 0; }
  }

  #stage {
    position: relative;
  }
</style>
</head>
<body>

<div id="stage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
function Root() {
  // dynamic island + status bar are part of the IOSDevice frame, but we render
  // our app's own status bar area handling by reserving space at top in <Home/>.
  return (
    <IOSDevice width={402} height={874}>
      <App />
    </IOSDevice>
  );
}

// Wait for components to be globally defined by babel scripts
function tryMount() {
  if (typeof IOSDevice === 'undefined' || typeof App === 'undefined') {
    return setTimeout(tryMount, 30);
  }
  ReactDOM.createRoot(document.getElementById('stage')).render(<Root />);
}
tryMount();
</script>

</body>
</html>
